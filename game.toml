# game.toml — Mario Tennis: Power Tour (GBA), versión europea (BTMP, rev. 0)
#
# Lo leen DOS programas:
#   1) gba_recompile (el recompilador): [program], [identity], [[extra_func]],
#      [[data_range]], [[code_copy]]...   Referencia: gbarecomp/docs/TOML_SCHEMA.md
#   2) el ejecutable del juego (runtime): [game], [bios], [rom], [save], [video].
#
# Las rutas se resuelven respecto a la carpeta donde está ESTE fichero.
# La ROM es tuya y no se incluye. La BIOS es libre (MIT, Cult-of-GBA).

[game]
name           = "Mario Tennis: Power Tour (Europa)"
short_name     = "mario_tennis_pt"
default_region = "eur"

[bios]
# BIOS libre incluida (16 KiB, licencia MIT). Se puede cambiar con --bios.
path = "bios_libre/bios_libre.bin"
sha1 = "2e41f9d30ecdf1c4540edf89ac16f49bf327edb7"
# Su pantalla de arranque se queda parada esperando una interrupción: se salta.
skip_intro = true

[rom]
path  = "roms/mario_tennis_power_tour_eur.gba"
sha1  = "d61990974040d405b5bf8436ac8e1e0beb0f7964"
crc32 = "0xC8DB4F60"

[save]
# El cartucho usa SRAM (firma "SRAM_V" en 0x00021730). 32 KiB.
type = "sram"
size = 32768

[video]
# Ancho lógico de la imagen. 240 = el de la GBA (relación 3:2).
view_width = 240

[program]
name         = "Mario Tennis: Power Tour (EUR)"
id           = "mtp_eur"
load_address = 0x08000000
size         = 0x01000000
entry_pc     = 0x08000000
static_resume_all = true
# Cosecha especulativa desactivada: decodificar datos como código es el error caro.
# Lo que falte lo avisa el runtime con el PC exacto y se añade con [[extra_func]].
speculative_literal_harvest = false
aot_scan_start = 0x08000000
aot_scan_end   = 0x09000000
codegen_shards = 64

[identity]
sha1 = "d61990974040d405b5bf8436ac8e1e0beb0f7964"

# ── Puntos de entrada conocidos ─────────────────────────────────────
[[extra_func]]
addr = 0x08000470
mode = "arm"
name = "crt0_start"
note = "Punto de entrada del cartucho (crt0)"

[[extra_func]]
addr = 0x0800070C
mode = "arm"
name = "irq_handler"
note = "Despachador de IRQ; el crt0 lo instala en 0x03007FFC"

[[extra_func]]
addr = 0x08013348
mode = "thumb"
name = "AgbMain"
note = "Función principal; la llama el crt0"

# ── Código que el arranque copia de la ROM a IWRAM (DMA3) ───────────
[[code_copy]]
runtime_start = 0x03000100
source_start  = 0x0800070C
size          = 0xE8
name          = "iwram_intrmain"
note          = "IntrMain: despachador de IRQ en IWRAM"

[[code_copy]]
runtime_start = 0x03000220
source_start  = 0x0800082C
size          = 0xFE0
name          = "iwram_codigo"
note          = "Rutinas ARM/Thumb del juego copiadas a IWRAM"

[[code_copy]]
runtime_start = 0x03006000
source_start  = 0x0825142C
size          = 0x400
name          = "iwram_6000"
note          = "Rutina copiada a 0x03006000"

[[extra_func]]
addr = 0x03000100
mode = "arm"
name = "IntrMain_arm"

[[extra_func]]
addr = 0x030001C0
mode = "thumb"
name = "IntrMain_thumb"

[[extra_func]]
addr = 0x030001C4
mode = "arm"
name = "IntrMain_arm2"

[[extra_func]]
addr = 0x03006000
mode = "thumb"
name = "iwram_6000_thumb"

# El descompresor propio del juego (ROM 0x080129E4 → IWRAM 0x03001400) NO se
# recompila a propósito: devuelve a una dirección calculada (`sub lr, pc, #284`)
# tras un `bl`, lo que desborda la pila de retornos del código generado. Se
# ejecuta con el intérprete (main.cpp: forzar_interprete), que no la usa.

# ── Rutinas reubicadas (se copian a RAM cada vez que se usan) ───────
[[extra_func]]
addr = 0x080019C0
mode = "thumb"
name = "reub_pila_th"

[[extra_func]]
addr = 0x080019C4
mode = "arm"
name = "reub_pila_arm"

