# bios_libre.toml — configuración de recompilación de la BIOS libre (Cult-of-GBA/BIOS).
#
# Se usa con:  gba_recompile --bios bios_libre/bios_libre.bin \
#                  --config bios_libre/bios_libre.toml --out generated_bios
#
# La BIOS libre es una reimplementación de la BIOS de GBA escrita desde cero en
# ensamblador ARM (licencia MIT, ver LICENSE-Cult-of-GBA-BIOS.txt). Su fuente está
# en https://github.com/Cult-of-GBA/BIOS y se compila con arm-none-eabi-as; el
# bios.bin del repositorio se reproduce byte a byte (SHA-1 abajo).
#
# Las direcciones salen de la tabla de símbolos de esa compilación
# (arm-none-eabi-nm), de la tabla de SWI (swi_table, 0x17C) y de la tabla de
# rutinas de CpuSet (0x254).

[program]
name         = "GBA BIOS libre (Cult-of-GBA)"
id           = "gba_bios_libre"
load_address = 0x00000000
size         = 0x00004000  # 16 KB
entry_pc     = 0x00000000
static_resume_all = true   # las interrupciones pueden reanudar en cualquier instrucción
speculative_literal_harvest = false

[identity]
sha1 = "2e41f9d30ecdf1c4540edf89ac16f49bf327edb7"

[[extra_func]]
